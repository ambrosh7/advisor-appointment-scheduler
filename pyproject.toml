[project]
name = "advisor-appointment-scheduler"
version = "0.1.0"
description = "Compliant pre-booking voice/chat agent for advisor appointments"
requires-python = ">=3.9"
# Note: fastmcp requires Python >=3.10; on 3.9 an in-process MCP shim is used.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-generativeai>=0.8",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# FastMCP server process (requires Python >=3.10). On 3.9 an in-process shim is used.
mcp = ["fastmcp>=2.0"]

[project.scripts]
advisor-chat = "api.chat.cli:main"
advisor-voice = "api.voice.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "voice: Phase 7 voice adapters (optional in CI)",
    "live_mcp: live Google Workspace / MCP credentials required",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
